<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Комерційна пропозиція</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root{
    --ink:#182337;
    --ink-soft:#5c6579;
    --paper:#f7f8fa;
    --line:#dde1e9;
    --brick:#13366b;
    --brick-soft:#fdf1cf;
    --gold:#f6c500;
    --gold-deep:#c99900;
    --navy-deep:#0a2044;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#eceef2;
    font-family:'Manrope', Arial, Helvetica, sans-serif;
    color:var(--ink);
    padding:28px 12px 60px;
  }
  .sheet{
    max-width:820px;
    margin:0 auto;
    background:var(--paper);
    box-shadow:0 8px 28px rgba(35,32,25,0.16);
    padding:44px 48px 40px;
  }
  .toolbar{
    max-width:820px;
    margin:0 auto 14px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  button{
    font-family:inherit;
    font-size:13px;
    border:1px solid var(--ink);
    background:var(--paper);
    color:var(--ink);
    padding:9px 16px;
    cursor:pointer;
    border-radius:2px;
  }
  button:hover{ background:var(--ink); color:var(--paper); }
  button.primary{ background:var(--brick); border-color:var(--brick); color:#fff; }
  button.primary:hover{ background:var(--navy-deep); border-color:var(--navy-deep); }
  button.ghost{ opacity:0.7; }

  /* header */
  .doc-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    border-bottom:2px solid var(--ink);
    padding-bottom:16px;
    margin-bottom:22px;
    gap:20px;
  }
  .brand-row{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .brand-logo{
    width:48px;
    height:48px;
    object-fit:contain;
    flex-shrink:0;
  }
  .brand input{
    font-family:'Manrope', Arial, sans-serif;
    font-size:22px;
    font-weight:700;
    letter-spacing:0.3px;
    color:var(--brick);
    width:100%;
    margin-bottom:4px;
  }
  .brand .sub{
    font-size:12px;
    color:var(--ink-soft);
    display:flex;
    align-items:baseline;
    gap:6px;
  }
  .brand .sub input.phone-field{ font-size:12px; color:var(--ink-soft); width:150px; font-weight:600; }
  .brand .sub input.chan-field{ font-size:11px; color:var(--ink-soft); width:220px; }
  .meta{ text-align:right; font-size:12px; color:var(--ink-soft); }
  .meta div{ margin-bottom:6px; display:flex; gap:6px; justify-content:flex-end; align-items:center; }
  .meta input{ text-align:right; width:140px; }

  .field{
    border:none;
    background:transparent;
    font:inherit;
    color:inherit;
    padding:2px 3px;
    border-bottom:1px dotted var(--line);
  }
  .field:focus{ outline:none; border-bottom:1px dotted var(--brick); }

  .title-line{
    font-family:'Manrope', Arial, sans-serif;
    font-size:15px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--ink);
    margin:0 0 4px;
  }
  .proposal-title-row{ font-size:13px; margin-bottom:12px; display:flex; gap:8px; align-items:baseline; }
  .proposal-title-row label{ color:var(--ink-soft); white-space:nowrap; }
  .proposal-title-row input{ flex:1; font-size:13px; font-weight:600; color:var(--brick); }

  .client-row{ font-size:13px; margin-bottom:22px; display:flex; gap:8px 16px; align-items:baseline; flex-wrap:wrap; }
  .client-row label{ color:var(--ink-soft); white-space:nowrap; }
  .client-row input{ flex:1; min-width:120px; font-size:13px; }

  table{ width:100%; border-collapse:collapse; margin-bottom:4px; }
  thead th{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    color:var(--ink-soft);
    text-align:left;
    border-bottom:1px solid var(--ink);
    padding:0 6px 8px;
    font-weight:600;
  }
  thead th.num{ text-align:right; }
  tbody td{
    padding:7px 6px;
    border-bottom:1px solid var(--line);
    font-size:13.5px;
    vertical-align:middle;
  }
  td.num{ text-align:right; white-space:nowrap; }
  td.idx{ color:var(--ink-soft); width:20px; }
  input.name-field{ width:100%; min-width:110px; }
  input.qty-field, input.unit-field{ width:52px; text-align:right; }
  input.unit-field{ width:40px; text-align:left; }
  input.price-field{ width:74px; text-align:right; }
  .sum-cell{ font-weight:600; }
  .row-actions{ width:26px; }
  .del-btn{
    border:none; background:none; color:var(--ink-soft);
    font-size:15px; line-height:1; padding:2px 4px; cursor:pointer;
  }
  .del-btn:hover{ color:var(--brick); background:none; }

  .photo-cell{ width:52px; }
  .photo-wrap{ position:relative; width:44px; height:44px; }
  .photo-box{
    width:44px; height:44px;
    border:1px dashed var(--line);
    border-radius:3px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:var(--ink-soft);
    font-size:18px;
    overflow:hidden;
    position:relative;
  }
  .photo-box img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .photo-box.has-photo{ border-style:solid; }
  .photo-box span{ pointer-events:none; }
  .photo-box.has-photo span{ display:none; }
  .photo-edit{
    position:absolute;
    bottom:-5px; right:-5px;
    width:17px; height:17px;
    border-radius:50%;
    background:var(--brick);
    color:#fff;
    border:1px solid var(--paper);
    font-size:9px;
    line-height:1;
    padding:0;
    cursor:pointer;
    display:none;
    align-items:center;
    justify-content:center;
  }
  .photo-wrap:hover .photo-edit{ display:flex; }
  @media (hover: none){
    .photo-edit{ display:flex; }
  }

  .table-scroll{
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    margin:0 -6px;
    padding:0 6px;
  }

  .lightbox{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(10,23,48,0.9);
    z-index:3000;
    align-items:center;
    justify-content:center;
    padding:30px;
    cursor:zoom-out;
  }
  .lightbox.open{ display:flex; }
  .lightbox img{
    max-width:92%;
    max-height:92%;
    border-radius:4px;
    box-shadow:0 12px 40px rgba(0,0,0,0.5);
  }

  .picker-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(10,23,48,0.62);
    z-index:1000;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .picker-overlay.open{ display:flex; }
  .picker-panel{
    background:var(--paper);
    max-width:560px;
    width:100%;
    max-height:86vh;
    overflow-y:auto;
    padding:26px;
    border-radius:4px;
    box-shadow:0 20px 60px rgba(0,0,0,0.4);
  }
  .picker-panel h3{
    font-family:'Manrope', Arial, sans-serif;
    font-size:17px;
    margin:0 0 16px;
    color:var(--ink);
  }
  .picker-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:12px;
  }
  .picker-card{
    border:1px solid var(--line);
    border-radius:4px;
    padding:8px;
    cursor:pointer;
    text-align:center;
    background:#fff;
    transition:border-color .15s;
  }
  .picker-card:hover{ border-color:var(--brick); }
  .picker-card .thumb{
    width:100%;
    aspect-ratio:1/1;
    border-radius:3px;
    margin-bottom:8px;
    background-color:var(--brick-soft);
    overflow:hidden;
  }
  .picker-card .thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .picker-card .pname{
    font-size:12px;
    font-weight:600;
    color:var(--ink);
    line-height:1.3;
  }
  .picker-card .pqty{
    font-size:10.5px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .picker-card.custom .thumb{
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    color:var(--ink-soft);
  }
  .picker-close{
    display:block;
    margin:18px auto 0;
    font-size:12px;
    opacity:0.7;
  }

  .saved-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:11px 2px;
    border-bottom:1px solid var(--line);
    gap:10px;
  }
  .saved-info{ min-width:0; }
  .saved-client{
    font-weight:600;
    font-size:13.5px;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .saved-meta{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .saved-actions{ display:flex; gap:6px; flex-shrink:0; }
  .saved-actions button{ font-size:11.5px; padding:6px 10px; }
  .saved-empty{ font-size:13px; color:var(--ink-soft); padding:18px 0; text-align:center; }

  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  input[type=number]{ -moz-appearance:textfield; }

  .delivery-block{
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid var(--ink);
    display:flex;
    justify-content:space-between;
    gap:20px;
    font-size:13.5px;
  }
  .delivery-block .loc{ flex:1; display:flex; gap:8px; align-items:baseline; }
  .delivery-block label{ color:var(--ink-soft); white-space:nowrap; }
  .delivery-block .loc input{ flex:1; }
  .delivery-block .cost{ text-align:right; white-space:nowrap; }
  .delivery-block .cost input{ width:80px; text-align:right; }

  .total-row{
    margin-top:16px;
    background:var(--brick);
    border-radius:6px;
    padding:16px 18px;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-size:15px;
  }
  .total-row .label{ font-weight:600; color:#eef2f8; }
  .total-row .value{ font-family:'Manrope', Arial, sans-serif; font-size:24px; font-weight:800; color:var(--gold); }

  .add-row-wrap{ margin-top:10px; }
  .add-row-wrap button{ font-size:12px; padding:6px 12px; }

  .empty-hint{
    font-size:12.5px;
    color:var(--ink-soft);
    padding:14px 0;
    font-style:italic;
  }

  .footnote{ margin-top:26px; font-size:11px; color:var(--ink-soft); }
  .footnote input{ width:100%; font-size:11px; color:var(--ink-soft); }

  .appendix-page{
    margin-top:28px;
    padding-top:22px;
    border-top:1px dashed var(--line);
  }
  .appendix-title{
    font-family:'Manrope', Arial, sans-serif;
    font-size:13px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 12px;
  }
  .appendix-photo-wrap{
    width:100%;
    max-width:420px;
    border:1px solid var(--line);
    border-radius:4px;
    overflow:hidden;
    margin-bottom:10px;
    background:#f2f0ea;
    cursor:zoom-in;
  }
  .appendix-photo-wrap img{
    width:100%;
    display:block;
  }
  .appendix-caption{
    font-size:15px;
    font-weight:700;
    color:var(--ink);
    font-family:'Manrope', Arial, sans-serif;
  }

  /* ---------- online viewer (presentation mode) ---------- */

  .viewer-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:#0a1730;
    z-index:2000;
    flex-direction:column;
  }
  .viewer-overlay.open{ display:flex; }
  .viewer-top{
    display:flex;
    justify-content:flex-end;
    padding:14px 18px;
  }
  .viewer-close{
    background:none;
    border:none;
    color:#fff;
    font-size:24px;
    line-height:1;
    cursor:pointer;
    padding:4px 8px;
  }
  .viewer-close:hover{ opacity:0.7; }
  .viewer-stage{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:0 66px;
    overflow:hidden;
    min-height:0;
  }
  .viewer-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:rgba(255,255,255,0.1);
    border:none;
    color:#fff;
    font-size:22px;
    width:44px; height:44px;
    border-radius:50%;
    cursor:pointer;
  }
  .viewer-arrow:hover{ background:rgba(255,255,255,0.2); }
  .viewer-arrow[disabled]{ opacity:0.2; cursor:default; }
  .viewer-arrow.prev{ left:14px; }
  .viewer-arrow.next{ right:14px; }
  .viewer-dots{
    display:flex;
    justify-content:center;
    gap:7px;
    padding:16px;
  }
  .viewer-dot{
    width:7px; height:7px;
    border-radius:50%;
    background:rgba(255,255,255,0.28);
    cursor:pointer;
  }
  .viewer-dot.active{ background:var(--gold); }

  .offer-slide{
    background:var(--paper);
    color:var(--ink);
    border-radius:8px;
    padding:30px 28px;
    max-width:600px;
    width:100%;
    max-height:82vh;
    overflow-y:auto;
  }
  .offer-brand-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .offer-logo{
    width:34px;
    height:34px;
    object-fit:contain;
    flex-shrink:0;
  }
  .offer-brand{
    font-family:'Manrope', Arial, sans-serif;
    font-size:19px;
    font-weight:700;
    color:var(--brick);
  }
  .offer-sub{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; margin-bottom:14px; }
  .offer-client{ font-size:13px; font-weight:600; margin-bottom:14px; }
  .offer-list{ border-top:1px solid var(--line); }
  .offer-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .offer-item-photo{
    width:44px; height:44px;
    border-radius:4px;
    background-color:var(--brick-soft);
    flex-shrink:0;
    overflow:hidden;
    cursor:zoom-in;
  }
  .offer-item-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .offer-item-mid{ flex:1; min-width:0; }
  .offer-item-name{ font-weight:600; font-size:13.5px; }
  .offer-item-sub{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .offer-item-sum{ font-weight:700; font-size:13.5px; white-space:nowrap; }
  .offer-delivery{ font-size:12.5px; color:var(--ink-soft); padding-top:12px; }
  .offer-total{
    margin-top:14px;
    padding-top:14px;
    border-top:2px solid var(--brick);
    display:flex;
    justify-content:space-between;
    font-size:17px;
    font-weight:700;
  }
  .offer-total span:last-child{ color:var(--gold-deep); font-weight:800; font-size:19px; }
  .offer-empty{ font-size:13px; color:var(--ink-soft); padding:20px 0; text-align:center; }

  .photo-slide{ text-align:center; color:#fff; max-width:100%; }
  .photo-slide img{
    max-width:100%;
    max-height:66vh;
    border-radius:6px;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
  }
  .photo-slide .caption{
    margin-top:18px;
    font-family:'Manrope', Arial, sans-serif;
    font-size:20px;
  }
  .photo-slide .price-tag{
    margin-top:6px;
    font-size:14px;
    color:rgba(255,255,255,0.72);
  }

  /* ---------- mobile ---------- */

  @media (max-width:640px){
    body{ padding:14px 8px 40px; }
    .toolbar{
      gap:8px;
    }
    .toolbar button{
      flex:1 1 calc(50% - 8px);
      padding:11px 10px;
      font-size:13px;
    }
    .sheet{
      padding:22px 16px 28px;
    }
    .doc-head{
      flex-direction:column;
      align-items:flex-start;
      gap:14px;
    }
    .brand-row, .brand, .meta{ width:100%; }
    .brand-logo{ width:38px; height:38px; }
    .brand input{ font-size:19px; }
    .brand .sub{ flex-wrap:wrap; }
    .brand .sub input.phone-field{ width:auto; flex:1 1 130px; }
    .brand .sub input.chan-field{ width:auto; flex:2 1 160px; }
    .meta{ text-align:left; }
    .meta div{ justify-content:flex-start; }
    .meta input{ text-align:left; width:auto; flex:1; }

    .client-row{ flex-wrap:wrap; }

    .field, input, select, textarea{ font-size:16px; }

    .table-scroll{ margin:0 -16px; padding:0 16px; }
    thead th{ font-size:9px; padding:0 2px 6px; }
    tbody td{ padding:5px 2px; font-size:12.5px; }
    .idx{ display:none; }
    .photo-cell{ width:36px; }
    .photo-wrap{ width:32px; height:32px; }
    .photo-box{ width:32px; height:32px; font-size:14px; }
    .photo-edit{ width:14px; height:14px; font-size:8px; }
    input.name-field{ min-width:64px; }
    input.qty-field{ width:42px; padding-left:1px; padding-right:1px; }
    input.unit-field{ width:30px; padding-left:1px; padding-right:1px; }
    input.price-field{ width:56px; padding-left:1px; padding-right:1px; }
    .sum-cell{ font-size:12px; }
    .row-actions{ width:18px; }
    .del-btn{ padding:2px 1px; font-size:14px; }

    .delivery-block{
      flex-direction:column;
      align-items:stretch;
      gap:10px;
    }
    .delivery-block .cost{ text-align:left; }
    .delivery-block .cost input{ width:100px; }

    .total-row{ padding:12px 14px; }

    .picker-panel, .picker-overlay .picker-panel{ padding:18px; }
    .picker-grid{ grid-template-columns:repeat(2, 1fr); gap:10px; }

    .lightbox{ padding:14px; }

    .viewer-stage{ padding:0 42px; }
    .viewer-arrow{ width:36px; height:36px; font-size:18px; }
    .viewer-arrow.prev{ left:6px; }
    .viewer-arrow.next{ right:6px; }
    .offer-slide{ padding:20px 16px; max-height:76vh; }
    .offer-brand{ font-size:17px; }
  }

  body.print-mode{ background:#fff; padding:0; }
  .print-mode .toolbar{ display:none; }
  .print-mode .sheet{ box-shadow:none; max-width:none; padding:8mm 12mm; }
  .print-mode .field{ border-bottom:none; }
  .print-mode .del-btn{ display:none; }
  .print-mode .add-row-wrap{ display:none; }
  .print-mode .photo-box{ border:none; cursor:default; }
  .print-mode .photo-edit{ display:none !important; }
  .print-mode .lightbox{ display:none !important; }
  .print-mode .picker-overlay{ display:none !important; }
  .print-mode .viewer-overlay{ display:none !important; }
  .print-mode .empty-hint{ display:none; }
  .print-mode .proposal-title-row:has(#proposalTitle:placeholder-shown){ display:none; }
  .print-mode .total-row{
    background:var(--brick-soft) !important;
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }
  .print-mode .total-row .label{ color:var(--ink) !important; }
  .print-mode .total-row .value{ color:var(--brick) !important; }
  .print-mode .appendix-photo-wrap{ cursor:default; page-break-inside:avoid; }
  .print-mode .appendix-page{ page-break-inside:avoid; }
  @page{ size:A4; margin:12mm; }
  @media print{
    .toolbar{ display:none; }
    .lightbox{ display:none !important; }
    .picker-overlay{ display:none !important; }
    .viewer-overlay{ display:none !important; }
  }
</style>
</head>
<body>

  <div class="toolbar no-print">
    <button class="primary" onclick="openViewer()">Переглянути КП</button>
    <button onclick="openPicker()">+ Додати товар</button>
    <button onclick="saveProposal()">Зберегти КП</button>
    <button onclick="openSavedList()">Мої КП</button>
    <button class="ghost" onclick="doPrint()">Друк</button>
    <button class="ghost" id="pdfBtn" onclick="downloadPdf()">Зберегти PDF</button>
    <button class="ghost" onclick="resetDoc()">Очистити (нова КП)</button>
  </div>

  <div class="sheet" id="sheet">

    <p class="title-line">Комерційна пропозиція</p>
    <div class="proposal-title-row">
      <label>Назва КП:</label>
      <input class="field" id="proposalTitle" placeholder="напр. КП Іванов - Кератерм" oninput="updateDocTitle()">
    </div>
    <div class="client-row">
      <label>Клієнт / об'єкт:</label>
      <input class="field" id="clientName" placeholder="назва компанії або об'єкта" oninput="updateDocTitle()">
      <label>Тел. клієнта:</label>
      <input class="field" id="clientPhone" placeholder="0XX XXX XX XX">
    </div>

    <div class="table-scroll">
    <table>
      <thead>
        <tr>
          <th class="photo-cell"></th>
          <th style="width:20px;"></th>
          <th>Товар</th>
          <th class="num">К-сть</th>
          <th>Од.</th>
          <th class="num">Ціна за од., грн</th>
          <th class="num">Сума, грн</th>

      <button onclick="openPicker()">+ Додати товар</button>
    </div>

      <div class="loc">
        <label>Доставка, локація:</label>
        <input class="field" id="deliveryLocation" placeholder="населений пункт / об'єкт">
      </div>
      <div class="cost">
        <label>Вартість доставки, грн:</label>
        <input class="field" id="deliveryCost" type="number" min="0" step="1" value="0" oninput="recalc()">
      </div>
    </div>

    <div class="total-row">
      <div class="label">Разом до сплати</div>
      <div class="value"><span id="totalValue">0</span> грн</div>
    </div>

      <button class="picker-close" onclick="closePicker()">Скасувати</button>

  </div>

      <button class="picker-close" onclick="closeSavedList()">Закрити</button>

function todayISO(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}

function updateDocTitle(){
  const t = document.getElementById('proposalTitle').value.trim();
  const c = document.getElementById('clientName').value.trim();
  document.title = t || (c ? ('КП - ' + c) : 'Комерційна пропозиція');
}

function pdfFileName(){
  const t = document.getElementById('proposalTitle').value.trim();
  const c = document.getElementById('clientName').value.trim();
  const raw = t || (c ? ('КП - ' + c) : 'Комерційна пропозиція');
  return raw.replace(/[\\/:*?"<>|]+/g, '').trim() + '.pdf';
}

function doPrint(){
  updateAppendix();
  document.body.classList.add('print-mode');
  window.print();
}

window.addEventListener('afterprint', function(){
  document.body.classList.remove('print-mode');
});

async function downloadPdf(){
  if(typeof html2pdf === 'undefined'){
    alert('Не вдалося завантажити модуль PDF. Спробуй кнопку "Друк" і збережи як PDF через діалог друку.');
    return;
  }
  const btn = document.getElementById('pdfBtn');
  const originalText = btn.textContent;
  btn.textContent = 'Генерується...';
  btn.disabled = true;
  updateAppendix();
  document.body.classList.add('print-mode');
  const el = document.getElementById('sheet');
  const opt = {
    margin: 8,
    filename: pdfFileName(),
    image: { type: 'jpeg', quality: 1 },
    html2canvas: {
      scale: 4,
      useCORS: true,
      backgroundColor: '#ffffff',
      letterRendering: true,
      dpi: 300
    },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait', compress: false },
    pagebreak: { mode: ['css', 'avoid-all'] }
  };
  try{
    await html2pdf().set(opt).from(el).save();
  }catch(err){
    console.error('pdf error', err);
    alert('Не вдалося зберегти PDF. Спробуй кнопку "Друк" і збережи як PDF через діалог друку.');
  }finally{
    document.body.classList.remove('print-mode');
    btn.textContent = originalText;
    btn.disabled = false;
  }
}

function fmt(n){
  return new Intl.NumberFormat('uk-UA', {maximumFractionDigits:2}).format(n);
}

/* ---------- product picker ---------- */

function renderPicker(){
  const grid = document.getElementById('pickerGrid');
  grid.innerHTML = '';
  PRODUCTS.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'picker-card';
    card.onclick = () => selectProduct(i);
    const qtyHint = p.qty !== undefined ? `<div class="pqty">${p.qty} шт/фура</div>` : '';
    card.innerHTML = `
      <div class="thumb"><img src="${p.photo}" alt=""></div>
      <div class="pname">${p.name}</div>
      ${qtyHint}
    `;
    grid.appendChild(card);
  });
  const custom = document.createElement('div');
  custom.className = 'picker-card custom';
  custom.onclick = () => selectCustom();
  custom.innerHTML = `
    <div class="thumb">+</div>
    <div class="pname">Свій товар</div>
  `;
  grid.appendChild(custom);
}

function openPicker(){
  document.getElementById('pickerOverlay').classList.add('open');
}

function closePicker(){
  document.getElementById('pickerOverlay').classList.remove('open');
}

function selectProduct(i){
  const p = PRODUCTS[i];
  addRow({ name: p.name, qty: (p.qty !== undefined ? p.qty : ''), unit: 'шт', price: '', photo: p.photo });
  closePicker();
}

function selectCustom(){
  addRow();
  closePicker();
}

/* ---------- rows / table ---------- */

function updateEmptyHint(){
  const rows = document.querySelectorAll('#itemsBody tr').length;
  document.getElementById('emptyHint').style.display = rows === 0 ? 'block' : 'none';
}

function addRow(prefill){
  rowCounter++;
  const id = 'row' + rowCounter;
  const tbody = document.getElementById('itemsBody');
  const tr = document.createElement('tr');
  tr.id = id;
  const photoImg = prefill && prefill.photo ? `<img src="${prefill.photo}" alt="">` : '';
  const photoClass = prefill && prefill.photo ? 'photo-box has-photo' : 'photo-box';
  const photoDataSrc = prefill && prefill.photo ? `data-src="${prefill.photo}"` : '';
  tr.innerHTML = `
    <td class="photo-cell">
      <div class="photo-wrap">
        <div class="${photoClass}" ${photoDataSrc} onclick="photoBoxClick('${id}')">${photoImg}<span>+</span></div>
        <button type="button" class="photo-edit no-print" onclick="event.stopPropagation(); document.getElementById('file_${id}').click()" title="Змінити фото">&#9998;</button>
      </div>
      <input type="file" id="file_${id}" accept="image/*" style="display:none" onchange="handlePhoto(event,'${id}')">
    </td>
    <td class="idx"></td>
    <td><input class="field name-field" placeholder="назва товару" value="${prefill?prefill.name:''}" oninput="updateAppendix()"></td>
    <td class="num"><input class="field qty-field" type="number" min="0" step="1" value="${prefill?prefill.qty:''}" oninput="recalcRow('${id}')"></td>
    <td><input class="field unit-field" placeholder="шт" value="${prefill?prefill.unit:'шт'}"></td>
    <td class="num"><input class="field price-field" type="number" min="0" step="0.01" value="${prefill?prefill.price:''}" oninput="recalcRow('${id}')"></td>
    <td class="num sum-cell"><span class="sum-display">0</span></td>
    <td class="row-actions no-print"><button class="del-btn" onclick="removeRow('${id}')">&times;</button></td>
  `;
  tbody.appendChild(tr);
  reindex();
  recalc();
  updateEmptyHint();
  updateAppendix();
}

function handlePhoto(event, id){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const box = document.querySelector('#' + id + ' .photo-box');
    box.querySelectorAll('img').forEach(img => img.remove());
    const img = document.createElement('img');
    img.src = e.target.result;
    box.insertBefore(img, box.firstChild);
    box.dataset.src = e.target.result;
    box.classList.add('has-photo');
    updateAppendix();
  };
  reader.readAsDataURL(file);
}

function photoBoxClick(id){
  const box = document.querySelector('#' + id + ' .photo-box');
  if(box.dataset.src){
    openLightbox(box.dataset.src);
  } else {
    document.getElementById('file_' + id).click();
  }
}

function openLightbox(src){
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
}

document.addEventListener('keydown', function(e){
  if(document.getElementById('viewerOverlay').classList.contains('open')){
    if(e.key === 'ArrowRight') viewerNext();
    if(e.key === 'ArrowLeft') viewerPrev();
    if(e.key === 'Escape') closeViewer();
    return;
  }
  if(e.key === 'Escape'){ closeLightbox(); closePicker(); closeSavedList(); }
});

function removeRow(id){
  const el = document.getElementById(id);
  if(el) el.remove();
  reindex();
  recalc();
  updateEmptyHint();
  updateAppendix();
}

function updateAppendix(){
  const container = document.getElementById('photoAppendix');
  if(!container) return;
  container.innerHTML = '';
  document.querySelectorAll('#itemsBody tr').forEach(tr => {
    const box = tr.querySelector('.photo-box');
    const src = box ? box.dataset.src : null;
    if(!src) return;
    const nameInput = tr.querySelector('.name-field');
    const name = (nameInput && nameInput.value) ? nameInput.value : 'Товар';
    const page = document.createElement('div');
    page.className = 'appendix-page';
    const title = document.createElement('div');
    title.className = 'appendix-title';
    title.textContent = 'Фото товару';
    page.appendChild(title);
    const wrap = document.createElement('div');
    wrap.className = 'appendix-photo-wrap';
    wrap.onclick = () => openLightbox(src);
    const img = document.createElement('img');
    img.src = src;
    img.alt = '';
    wrap.appendChild(img);
    page.appendChild(wrap);
    const cap = document.createElement('div');
    cap.className = 'appendix-caption';
    cap.textContent = name;
    page.appendChild(cap);
    container.appendChild(page);
  });
}

function reindex(){
  const rows = document.querySelectorAll('#itemsBody tr');
  rows.forEach((r,i) => { r.querySelector('.idx').textContent = i+1; });
}

function recalcRow(id){
  recalc();
}

function recalc(){
  let itemsTotal = 0;
  document.querySelectorAll('#itemsBody tr').forEach(tr => {
    const qty = parseFloat(tr.querySelector('.qty-field').value) || 0;
    const price = parseFloat(tr.querySelector('.price-field').value) || 0;
    const sum = qty * price;
    tr.querySelector('.sum-display').textContent = fmt(sum);
    itemsTotal += sum;
  });
  const deliveryCost = parseFloat(document.getElementById('deliveryCost').value) || 0;
  const total = itemsTotal + deliveryCost;
  document.getElementById('totalValue').textContent = fmt(total);
}

/* ---------- reset ---------- */

function resetDoc(){
  if(!confirm('Очистити всі товари і почати нову КП?')) return;
  document.getElementById('itemsBody').innerHTML = '';
  document.getElementById('proposalTitle').value = '';
  document.getElementById('clientName').value = '';
  document.getElementById('clientPhone').value = '';
  document.getElementById('deliveryLocation').value = '';
  document.getElementById('deliveryCost').value = 0;
  document.getElementById('footnote').value = '';
  document.getElementById('docDate').value = todayISO();
  updateEmptyHint();
  recalc();
  updateAppendix();
  updateDocTitle();
}

/* ---------- save / load proposals (у своєму браузері) ---------- */

function saveProposal(){
  try{
    const items = [];
    document.querySelectorAll('#itemsBody tr').forEach(tr=>{
      const box = tr.querySelector('.photo-box');
      items.push({
        name: tr.querySelector('.name-field').value,
        qty: tr.querySelector('.qty-field').value,
        unit: tr.querySelector('.unit-field').value,
        price: tr.querySelector('.price-field').value,
        photo: box ? (box.dataset.src || '') : ''
      });
    });
    if(items.length === 0){
      alert('Спочатку додай хоча б один товар.');
      return;
    }
    const data = {
      proposalTitle: document.getElementById('proposalTitle').value,
      client: document.getElementById('clientName').value || 'Без назви',
      clientPhone: document.getElementById('clientPhone').value,
      date: document.getElementById('docDate').value,
      companyName: document.getElementById('companyName').value,
      companyPhone: document.getElementById('companyPhone').value,
      companyChannels: document.getElementById('companyChannels').value,
      deliveryLocation: document.getElementById('deliveryLocation').value,
      deliveryCost: document.getElementById('deliveryCost').value,
      footnote: document.getElementById('footnote').value,
      items: items,
      total: document.getElementById('totalValue').textContent,
      savedAt: Date.now()
    };
    const id = 'kp_' + Date.now();
    localStorage.setItem(id, JSON.stringify(data));
    alert('КП збережено: ' + data.client);
  }catch(err){
    console.error('save error', err);
    alert('Помилка збереження. Можливо, в браузері вимкнено збереження даних (приватний режим).');
  }
}

function openSavedList(){
  const listEl = document.getElementById('savedList');
  document.getElementById('savedOverlay').classList.add('open');
  try{
    const entries = [];
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(!k || k.indexOf('kp_') !== 0) continue;
      try{
        const raw = localStorage.getItem(k);
        if(raw) entries.push({ key: k, data: JSON.parse(raw) });
      }catch(e){ /* пропускаємо пошкоджений запис */ }
    }
    entries.sort((a,b) => (b.data.savedAt||0) - (a.data.savedAt||0));
    if(entries.length === 0){
      listEl.innerHTML = '<div class="saved-empty">Збережених КП ще немає.</div>';
      return;
    }
    listEl.innerHTML = '';
    entries.forEach(entry => {
      const row = document.createElement('div');
      row.className = 'saved-item';
      const d = entry.data;
      row.innerHTML = `
        <div class="saved-info">
          <div class="saved-client"></div>
          <div class="saved-meta"></div>
        </div>
        <div class="saved-actions">
          <button type="button">Відкрити</button>
          <button type="button" class="ghost">Видалити</button>
        </div>
      `;
      row.querySelector('.saved-client').textContent = d.proposalTitle || d.client || 'Без назви';
      const metaClient = d.proposalTitle && d.client ? (d.client + ' · ') : '';
      row.querySelector('.saved-meta').textContent = metaClient + (d.date || '') + ' · ' + (d.total || '0') + ' грн';
      const btns = row.querySelectorAll('button');
      btns[0].onclick = () => loadProposal(entry.key);
      btns[1].onclick = () => deleteProposal(entry.key);
      listEl.appendChild(row);
    });
  }catch(err){
    console.error('list error', err);
    listEl.innerHTML = '<div class="saved-empty">Помилка завантаження списку.</div>';
  }
}

function closeSavedList(){
  document.getElementById('savedOverlay').classList.remove('open');
}

function loadProposal(key){
  try{
    const raw = localStorage.getItem(key);
    if(!raw){
      alert('Не вдалося відкрити цю КП.');
      return;
    }
    const data = JSON.parse(raw);
    document.getElementById('proposalTitle').value = data.proposalTitle || '';
    document.getElementById('clientName').value = data.client || '';
    document.getElementById('clientPhone').value = data.clientPhone || '';
    document.getElementById('docDate').value = data.date || todayISO();
    document.getElementById('companyName').value = data.companyName || 'БУДМАТ ГРУП';
    document.getElementById('companyPhone').value = data.companyPhone || '';
    document.getElementById('companyChannels').value = data.companyChannels || '';
    document.getElementById('deliveryLocation').value = data.deliveryLocation || '';
    document.getElementById('deliveryCost').value = data.deliveryCost || 0;
    document.getElementById('footnote').value = data.footnote || '';
    document.getElementById('itemsBody').innerHTML = '';
    (data.items || []).forEach(it => addRow(it));
    recalc();
    updateEmptyHint();
    updateAppendix();
    updateDocTitle();
    closeSavedList();
  }catch(err){
    console.error('load error', err);
    alert('Помилка відкриття КП.');
  }
}

function deleteProposal(key){
  if(!confirm('Видалити цю КП зі збережених? Дію не можна скасувати.')) return;
  try{
    localStorage.removeItem(key);
    openSavedList();
  }catch(err){
    console.error('delete error', err);
    alert('Не вдалося видалити.');
  }
}

/* ---------- online viewer (presentation mode) ---------- */

function buildSlides(){
  slides = [{ type: 'offer' }];
  document.querySelectorAll('#itemsBody tr').forEach(tr => {
    const box = tr.querySelector('.photo-box');
    const src = box ? box.dataset.src : null;
    if(!src) return;
    slides.push({
      type: 'photo',
      src: src,
      name: tr.querySelector('.name-field').value || 'Товар',
      price: tr.querySelector('.price-field').value,
      unit: tr.querySelector('.unit-field').value
    });
  });
}

function buildOfferSlideElement(){
  const wrap = document.createElement('div');
  wrap.className = 'offer-slide';

  const brandRow = document.createElement('div');
  brandRow.className = 'offer-brand-row';
  const headerLogo = document.querySelector('.brand-logo');
  if(headerLogo){
    const logoImg = document.createElement('img');
    logoImg.className = 'offer-logo';
    logoImg.src = headerLogo.src;
    logoImg.alt = '';
    brandRow.appendChild(logoImg);
  }
  const brand = document.createElement('div');
  brand.className = 'offer-brand';
  brand.textContent = document.getElementById('companyName').value || '';
  brandRow.appendChild(brand);
  wrap.appendChild(brandRow);

  const sub = document.createElement('div');
  sub.className = 'offer-sub';
  const phone = document.getElementById('companyPhone').value || '';
  const channels = document.getElementById('companyChannels').value || '';
  sub.textContent = [phone, channels].filter(Boolean).join('  ·  ');
  wrap.appendChild(sub);

  const client = document.getElementById('clientName').value;
  const clientPhone = document.getElementById('clientPhone').value;
  if(client || clientPhone){
    const cl = document.createElement('div');
    cl.className = 'offer-client';
    cl.textContent = 'Для: ' + [client, clientPhone].filter(Boolean).join(', ');
    wrap.appendChild(cl);
  }

  const rows = document.querySelectorAll('#itemsBody tr');
  const list = document.createElement('div');
  list.className = 'offer-list';

  if(rows.length === 0){
    const empty = document.createElement('div');
    empty.className = 'offer-empty';
    empty.textContent = 'Товари ще не додані.';
    list.appendChild(empty);
  } else {
    rows.forEach(tr => {
      const box = tr.querySelector('.photo-box');
      const src = box ? box.dataset.src : '';
      const name = tr.querySelector('.name-field').value || 'Товар';
      const qty = tr.querySelector('.qty-field').value || '0';
      const unit = tr.querySelector('.unit-field').value || '';
      const price = tr.querySelector('.price-field').value || '0';
      const sum = tr.querySelector('.sum-display').textContent;

      const item = document.createElement('div');
      item.className = 'offer-item';

      const photo = document.createElement('div');
      photo.className = 'offer-item-photo';
      if(src){
        const img = document.createElement('img');
        img.src = src;
        photo.appendChild(img);
        photo.onclick = () => openLightbox(src);
      }
      item.appendChild(photo);

      const mid = document.createElement('div');
      mid.className = 'offer-item-mid';
      const nm = document.createElement('div');
      nm.className = 'offer-item-name';
      nm.textContent = name;
      const sb = document.createElement('div');
      sb.className = 'offer-item-sub';
      sb.textContent = qty + ' ' + unit + ' × ' + price + ' грн';
      mid.appendChild(nm);
      mid.appendChild(sb);
      item.appendChild(mid);

      const sm = document.createElement('div');
      sm.className = 'offer-item-sum';
      sm.textContent = sum + ' грн';
      item.appendChild(sm);

      list.appendChild(item);
    });
  }
  wrap.appendChild(list);

  const deliveryLoc = document.getElementById('deliveryLocation').value;
  const deliveryCost = document.getElementById('deliveryCost').value;
  if(deliveryLoc || (deliveryCost && parseFloat(deliveryCost) > 0)){
    const dl = document.createElement('div');
    dl.className = 'offer-delivery';
    dl.textContent = 'Доставка' + (deliveryLoc ? ' · ' + deliveryLoc : '') + ': ' + fmt(parseFloat(deliveryCost) || 0) + ' грн';
    wrap.appendChild(dl);
  }

  const total = document.createElement('div');
  total.className = 'offer-total';
  const totalLabel = document.createElement('span');
  totalLabel.textContent = 'Разом';
  const totalVal = document.createElement('span');
  totalVal.textContent = document.getElementById('totalValue').textContent + ' грн';
  total.appendChild(totalLabel);
  total.appendChild(totalVal);
  wrap.appendChild(total);

  return wrap;
}

function buildPhotoSlideElement(slide){
  const wrap = document.createElement('div');
  wrap.className = 'photo-slide';

  const img = document.createElement('img');
  img.src = slide.src;
  wrap.appendChild(img);

  const cap = document.createElement('div');
  cap.className = 'caption';
  cap.textContent = slide.name;
  wrap.appendChild(cap);

  if(slide.price){
    const pt = document.createElement('div');
    pt.className = 'price-tag';
    pt.textContent = fmt(parseFloat(slide.price) || 0) + ' грн / ' + (slide.unit || 'шт');
    wrap.appendChild(pt);
  }

  return wrap;
}

function renderSlide(){
  const host = document.getElementById('viewerSlideHost');
  host.innerHTML = '';
  const slide = slides[currentSlide];
  if(slide.type === 'offer'){
    host.appendChild(buildOfferSlideElement());
  } else {
    host.appendChild(buildPhotoSlideElement(slide));
  }
  renderDots();
  document.getElementById('viewerPrev').disabled = currentSlide === 0;
  document.getElementById('viewerNext').disabled = currentSlide === slides.length - 1;
}

function renderDots(){
  const dotsEl = document.getElementById('viewerDots');
  dotsEl.innerHTML = '';
  slides.forEach((s, i) => {
    const d = document.createElement('div');
    d.className = 'viewer-dot' + (i === currentSlide ? ' active' : '');
    d.onclick = () => { currentSlide = i; renderSlide(); };
    dotsEl.appendChild(d);
  });
}

function viewerNext(){
  if(currentSlide < slides.length - 1){ currentSlide++; renderSlide(); }
}

function viewerPrev(){
  if(currentSlide > 0){ currentSlide--; renderSlide(); }
}

function openViewer(){
  buildSlides();
  currentSlide = 0;
  document.getElementById('viewerOverlay').classList.add('open');
  renderSlide();
}

function closeViewer(){
  document.getElementById('viewerOverlay').classList.remove('open');
}

(function initSwipe(){
  let startX = null;
  const stage = document.getElementById('viewerStage');
  stage.addEventListener('touchstart', e => { startX = e.touches[0].clientX; });
  stage.addEventListener('touchend', e => {
    if(startX === null) return;
    const dx = e.changedTouches[0].clientX - startX;
    if(dx > 50) viewerPrev();
    else if(dx < -50) viewerNext();
    startX = null;
  });
})();

/* ---------- init ---------- */

document.getElementById('docDate').value = todayISO();
renderPicker();
updateEmptyHint();
recalc();
updateDocTitle();
</script>
</body>
</html>
